<!-- El contenedor del formulario es ahora el único elemento principal -->
<div class="login-container">
  <div class="logo-container">
    <img src="assets/Esiadlogo.png" alt="Logo ESIAD ARQ">
  </div>

  <h2>Acceder</h2>

  <form (submit)="onSubmit($event)">
    <div class="input-group">
      <i class="fas fa-user icon"></i>
      <input
        type="text"
        name="username"
        placeholder="Usuario"
        [(ngModel)]="username"
        [disabled]="isSubmitting"
      >
    </div>

    <div class="input-group">
      <i class="fas fa-lock icon"></i>
      <input
        type="password"
        name="password"
        placeholder="Contrasena"
        [(ngModel)]="password"
        [disabled]="isSubmitting"
      >
    </div>

    <p class="inline-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="links">
      <a href="#">¿Olvidó su contraseña?</a>
      <a href="#">Iniciar sesión con otra cuenta</a>
    </div>
    
    <button type="submit" class="submit-btn" [disabled]="isSubmitting">
      {{ isSubmitting ? 'INGRESANDO...' : 'SIGUIENTE' }}
    </button>
  </form>
</div>
